openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Website analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyze:
    post:
      operationId: startAnalysis
      tags: [analysis]
      summary: Start a new website analysis
      description: Initiates analysis with questionnaire data and URL or HTML input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAnalysisRequest"
      responses:
        "201":
          description: Analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisStarted"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /prefill:
    post:
      operationId: prefillQuestionnaire
      tags: [analysis]
      summary: AI pre-fill for questionnaire
      description: Uses AI to suggest buyer personas and competitor URLs from company name and website URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrefillBody"
      responses:
        "200":
          description: Pre-fill suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrefillResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analyze/{id}:
    get:
      operationId: getAnalysisReport
      tags: [analysis]
      summary: Get analysis report
      description: Returns the completed analysis report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisReport"
        "404":
          description: Analysis not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/report-deliveries:
    get:
      operationId: listReportDeliveries
      tags: [admin]
      summary: Permission-controlled delivery log
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: consent, in: query, schema: { type: string, enum: [only] } }
      responses:
        "200":
          description: Newest deliveries first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDeliveryPage"
        "401": { description: Not authenticated }
        "403": { description: Feature permission required }
        "500": { description: Delivery log unavailable }

  /admin/report-deliveries/export.csv:
    get:
      operationId: exportReportDeliveriesCsv
      tags: [admin]
      summary: Download up to 10000 filtered deliveries as injection-safe German CSV
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: consent, in: query, schema: { type: string, enum: [only] } }
      responses:
        "200":
          description: Semicolon-separated UTF-8 CSV with BOM and CRLF
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Not authenticated }
        "403": { description: Feature permission required }
        "500": { description: CSV unavailable }

  /admin/report-deliveries/{id}/report:
    get:
      operationId: downloadDeliveryReport
      tags: [admin]
      summary: Download the HTML export of the linked analysis
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: HTML attachment
          content:
            text/html:
              schema: { type: string }
        "400": { description: Invalid ID }
        "401": { description: Not authenticated }
        "403": { description: Feature permission required }
        "404": { description: No linked HTML export }
        "500": { description: Report unavailable }

  /admin/report-deliveries/{id}:
    delete:
      operationId: deleteReportDelivery
      tags: [admin]
      summary: Delete only this delivery record
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Delivery deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDeliveryDeletion"
        "400": { description: Invalid ID }
        "401": { description: Not authenticated }
        "403": { description: Feature permission required }
        "404": { description: Delivery not found }
        "500": { description: Deletion failed }

components:
  schemas:
    ReportDeliveryItem:
      type: object
      required: [id, createdAt, recipientEmail, companyName, domain, gaioScore, reportType, consentMarketing, consentAt, consentText, status, errorMessage, analysisLogId, hasReport]
      properties:
        id: { type: integer }
        createdAt: { type: ["string", "null"] }
        recipientEmail: { type: string }
        companyName: { type: ["string", "null"] }
        domain: { type: ["string", "null"] }
        gaioScore: { type: ["integer", "null"] }
        reportType: { type: string, enum: [html, pdf] }
        consentMarketing: { type: boolean }
        consentAt: { type: ["string", "null"] }
        consentText: { type: ["string", "null"] }
        status: { type: string, enum: [sent, failed, not_configured] }
        errorMessage: { type: ["string", "null"] }
        analysisLogId: { type: ["integer", "null"] }
        hasReport: { type: boolean }
    ReportDeliveryPage:
      type: object
      required: [items, total, page, pages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportDeliveryItem" }
        total: { type: integer }
        page: { type: integer }
        pages: { type: integer }
    ReportDeliveryDeletion:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    PrefillBody:
      type: object
      properties:
        company_name:
          type: string
        url:
          type: string
      required:
        - company_name
        - url

    PrefillCompetitor:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        verified:
          type: boolean
      required:
        - name
        - url
        - verified

    PrefillResponse:
      type: object
      properties:
        personas:
          type: string
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/PrefillCompetitor"
        content_summary:
          type: ["string", "null"]
        crawl_failed:
          type: boolean
        crawl_fail_reason:
          type: ["string", "null"]
      required:
        - personas
        - competitors
        - content_summary
        - crawl_failed
        - crawl_fail_reason

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    QuestionnaireData:
      type: object
      properties:
        companyPitch:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        brandName:
          type: ["string", "null"]
        brandVariants:
          type: ["string", "null"]
        subBrands:
          type: ["string", "null"]
        slogans:
          type: ["string", "null"]
        buyerPersonas:
          type: ["string", "null"]
        geographicFocus:
          type: ["string", "null"]
        contentLanguages:
          type: ["string", "null"]
        competitors:
          type: ["string", "null"]
        differentiators:
          type: ["string", "null"]
        influencers:
          type: ["string", "null"]
        socialMedia:
          type: ["string", "null"]
        microsites:
          type: ["string", "null"]
        directories:
          type: ["string", "null"]
        reviewPlatforms:
          type: ["string", "null"]
        seoTools:
          type: ["string", "null"]
        dataSources:
          type: ["string", "null"]
        restrictions:
          type: ["string", "null"]
        strategicPriority:
          type: ["string", "null"]
        kpis:
          type: ["string", "null"]
        weightingPreferences:
          type: ["string", "null"]
        plannedCampaigns:
          type: ["string", "null"]

    StartAnalysisRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [url, html]
        url:
          type: ["string", "null"]
        html:
          type: ["string", "null"]
        questionnaire:
          $ref: "#/components/schemas/QuestionnaireData"
        explicitUrls:
          type: array
          items:
            type: string
          nullable: true
          description: If provided, skip auto-crawl and use these URLs directly
        fillToMax:
          type: ["boolean", "null"]
        excludedUrls:
          type: ["array", "null"]
          items:
            type: string
      required:
        - mode

    AnalysisStarted:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
      required:
        - id
        - status

    TechnicalSeoResult:
      type: object
      properties:
        score:
          type: number
        responseTime:
          type: number
        ttfb:
          type: number
        httpStatusCodes:
          type: object
          additionalProperties:
            type: integer
        robotsTxt:
          type: boolean
        sitemapXml:
          type: boolean
        canonicalTags:
          type: object
          properties:
            present:
              type: boolean
            count:
              type: integer
          required: [present, count]
        hreflang:
          type: object
          properties:
            present:
              type: boolean
            languages:
              type: array
              items:
                type: string
            consistent:
              type: boolean
          required: [present, languages, consistent]
        metaTitles:
          type: object
          properties:
            present:
              type: integer
            avgLength:
              type: number
            tooShort:
              type: integer
            tooLong:
              type: integer
            missing:
              type: integer
          required: [present, avgLength, tooShort, tooLong, missing]
        metaDescriptions:
          type: object
          properties:
            present:
              type: integer
            avgLength:
              type: number
            tooShort:
              type: integer
            tooLong:
              type: integer
            missing:
              type: integer
          required: [present, avgLength, tooShort, tooLong, missing]
        imageAltCoverage:
          type: number
        mobileViewport:
          type: boolean
        httpsEnforced:
          type: boolean
        breakdown:
          $ref: "#/components/schemas/TechnicalScoreBreakdown"
      required:
        - score
        - responseTime
        - ttfb
        - robotsTxt
        - sitemapXml
        - canonicalTags
        - hreflang
        - metaTitles
        - metaDescriptions
        - imageAltCoverage
        - mobileViewport
        - httpsEnforced

    TechnicalScoreComponent:
      type: object
      required: [key, weight, fraction, points, detail]
      properties:
        key:
          type: string
          enum: [https, crawl, robots, sitemap, indexable, canonical, title, description, viewport, alt, response, hreflang]
        weight:
          type: number
        fraction:
          type: [number, "null"]
        points:
          type: [number, "null"]
        detail:
          type: object
          additionalProperties:
            type: [number, string, boolean, "null"]
    TechnicalScoreBreakdown:
      type: object
      required: [components, evaluatedWeight, params]
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/TechnicalScoreComponent"
        evaluatedWeight:
          type: number
        params:
          type: object
          required: [title_min, title_max, desc_min, desc_max]
          properties:
            title_min:
              type: number
            title_max:
              type: number
            desc_min:
              type: number
            desc_max:
              type: number

    SchemaOrgResult:
      type: object
      properties:
        score:
          type: number
        detectedTypes:
          type: array
          items:
            type: string
        missingHighValue:
          type: array
          items:
            type: string
        productSchemaDetails:
          type: object
          additionalProperties:
            type: boolean
        validationErrors:
          type: array
          items:
            type: string
      required:
        - score
        - detectedTypes
        - missingHighValue
        - validationErrors

    HeadingResult:
      type: object
      properties:
        score:
          type: number
        pages:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              h1Count:
                type: integer
              hasHierarchyIssues:
                type: boolean
              headings:
                type: array
                items:
                  type: object
                  properties:
                    level:
                      type: string
                    text:
                      type: string
                  required: [level, text]
            required: [url, h1Count, hasHierarchyIssues, headings]
        keywordInHeadings:
          type: boolean
      required:
        - score
        - pages
        - keywordInHeadings

    ContentRelevanceResult:
      type: object
      properties:
        score:
          type: number
        dimensions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              score:
                type: number
              findings:
                type: array
                items:
                  type: string
            required: [name, score, findings]
      required:
        - score
        - dimensions

    FaqResult:
      type: object
      properties:
        score:
          type: number
        faqItemsFound:
          type: integer
        hasFaqSchema:
          type: boolean
        hasHtmlFaq:
          type: boolean
        qualityAssessment:
          type: ["string", "null"]
      required:
        - score
        - faqItemsFound
        - hasFaqSchema
        - hasHtmlFaq

    LlmQuestion:
      type: object
      properties:
        question:
          type: string
        rating:
          type: number
        gap:
          type: string
      required:
        - question
        - rating
        - gap

    LlmDiscoverabilityResult:
      type: object
      properties:
        score:
          type: number
        questions:
          type: array
          items:
            $ref: "#/components/schemas/LlmQuestion"
      required:
        - score
        - questions

    CompetitorFindings:
      type: object
      properties:
        betterThanYou:
          type: string
        yourAdvantage:
          type: string
        recommendation:
          type: string
      required:
        - betterThanYou
        - yourAdvantage
        - recommendation

    CrawlFailure:
      type: object
      properties:
        url:
          type: string
        reason:
          type: string
        statusCode:
          type: integer
        retries:
          type: integer
      required: [url, reason]

    BlockedRobotsHint:
      type: object
      required: [crawlers, generalRule, fullyBlockedAgents]
      properties:
        crawlers:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string
                enum: [allowed, disallowed, not_mentioned]
        generalRule:
          type: string
          enum: [allowed, blocked, partial]
        fullyBlockedAgents:
          type: array
          items:
            type: string
    CrawlReliability:
      type: object
      properties:
        attempted:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        failures:
          type: array
          items:
            $ref: "#/components/schemas/CrawlFailure"
        transientErrors:
          type: integer
        recoveredAfterRetry:
          type: integer
        timedOut:
          type: boolean
        techPhaseMs:
          type: number
        pagePhaseMs:
          type: number
        maxPages:
          type: integer
        serverErrors:
          type: integer
      required: [attempted, succeeded, failed, failures]

    CompetitorScore:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        technicalScore:
          type: number
        schemaScore:
          type: number
        contentScore:
          type: number
        headingScore:
          type: number
        faqScore:
          type: number
        compositeScore:
          type: number
        crawledPagesCount:
          type: integer
        crawlReliability:
          $ref: "#/components/schemas/CrawlReliability"
        findings:
          oneOf:
            - $ref: "#/components/schemas/CompetitorFindings"
            - type: "null"
      required:
        - name
        - url
        - technicalScore
        - schemaScore
        - contentScore
        - headingScore
        - faqScore
        - compositeScore
        - crawledPagesCount

    CompetitorResult:
      type: object
      properties:
        competitors:
          type: array
          items:
            $ref: "#/components/schemas/CompetitorScore"
      required:
        - competitors

    Recommendation:
      type: object
      properties:
        tier:
          type: string
          enum: [critical, high_leverage, secondary]
        finding:
          type: string
        whyItMatters:
          type: string
        fixInstruction:
          type: string
      required:
        - tier
        - finding
        - whyItMatters
        - fixInstruction

    AnalysisReport:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        url:
          type: ["string", "null"]
        mode:
          type: string
          enum: [url, html]
        overallScore:
          type: ["number", "null"]
        crawlReliability:
          $ref: "#/components/schemas/CrawlReliability"
        currentModule:
          type: ["string", "null"]
        progress:
          type: number
        technicalSeo:
          oneOf:
            - $ref: "#/components/schemas/TechnicalSeoResult"
            - type: "null"
        schemaOrg:
          oneOf:
            - $ref: "#/components/schemas/SchemaOrgResult"
            - type: "null"
        headingStructure:
          oneOf:
            - $ref: "#/components/schemas/HeadingResult"
            - type: "null"
        contentRelevance:
          oneOf:
            - $ref: "#/components/schemas/ContentRelevanceResult"
            - type: "null"
        faqQuality:
          oneOf:
            - $ref: "#/components/schemas/FaqResult"
            - type: "null"
        llmDiscoverability:
          oneOf:
            - $ref: "#/components/schemas/LlmDiscoverabilityResult"
            - type: "null"
        competitorComparison:
          oneOf:
            - $ref: "#/components/schemas/CompetitorResult"
            - type: "null"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        errorCode:
          type: string
          enum: [crawl_bot_protection, crawl_parked_domain, crawl_timed_out, crawl_no_selected_page, crawl_unreachable]
        blockedRobotsHint:
          $ref: "#/components/schemas/BlockedRobotsHint"
        errors:
          type: array
          items:
            type: string
        crawledPages:
          type: array
          items:
            type: string
      required:
        - id
        - status
        - mode
        - progress
        - recommendations
        - errors
        - crawledPages
